<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Shaik Fayaz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #e9edff;
            --muted: #aab3d1;
            --primary: #8ca3ff;
            --primary-strong: #5f78ef;
            --glass: rgba(19, 25, 56, 0.68);
            --glass-border: rgba(196, 206, 255, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background:
                linear-gradient(135deg, rgba(56, 73, 162, 0.22), transparent 38%),
                linear-gradient(315deg, rgba(74, 51, 151, 0.18), transparent 42%),
                linear-gradient(180deg, #090d22 0%, #111735 100%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 85%);
        }

        .welcome-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px;
        }

        .welcome-shell {
            width: min(1120px, 100%);
            min-height: 620px;
            display: grid;
            grid-template-columns: 1.12fr 0.88fr;
            align-items: stretch;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            background: var(--glass);
            box-shadow: 0 32px 90px rgba(3, 6, 24, 0.48);
            -webkit-backdrop-filter: blur(22px);
            backdrop-filter: blur(22px);
            animation: reveal 0.8s ease-out both;
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(18px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .welcome-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 66px;
        }

        .welcome-badge {
            width: fit-content;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 24px;
            padding: 8px 12px;
            border: 1px solid rgba(161, 176, 255, 0.18);
            border-radius: 999px;
            background: rgba(140, 163, 255, 0.08);
            color: #cbd4ff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .welcome-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #70d5d8;
            box-shadow: 0 0 16px rgba(112, 213, 216, 0.8);
        }

        .welcome-title {
            max-width: 620px;
            font-family: 'Poppins', sans-serif;
            font-size: clamp(3rem, 6vw, 5.7rem);
            line-height: 0.98;
            letter-spacing: 0;
            margin-bottom: 24px;
        }

        .welcome-title span {
            display: block;
            color: var(--primary);
        }

        .welcome-text {
            max-width: 520px;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.75;
            margin-bottom: 34px;
        }

        .welcome-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .enter-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 52px;
            padding: 0 22px;
            border: 1px solid rgba(196, 206, 255, 0.18);
            border-radius: 8px;
            background: var(--primary-strong);
            color: #ffffff;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 16px 38px rgba(70, 89, 190, 0.28);
            transition: 0.22s ease;
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            background: #6b82ef;
            box-shadow: 0 20px 44px rgba(70, 89, 190, 0.38);
        }

        .rating-reminder {
            color: #c5cceb;
            font-size: 13px;
        }

        .rating-reminder strong {
            color: #f4c66a;
        }

        .portrait-panel {
            position: relative;
            min-height: 620px;
            display: grid;
            place-items: end center;
            overflow: hidden;
            border-left: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.025);
        }

        .portrait-panel img {
            width: 88%;
            height: 92%;
            align-self: end;
            object-fit: cover;
            object-position: center 16%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-bottom: 0;
            border-radius: 14px 14px 0 0;
            filter: saturate(0.92) contrast(1.03);
        }

        .portrait-label {
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            background: rgba(12, 17, 43, 0.72);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
        }

        .portrait-label strong {
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        .portrait-label span {
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 860px) {
            .welcome-page { padding: 16px; }
            .welcome-shell {
                grid-template-columns: 1fr;
                min-height: auto;
            }
            .welcome-content {
                padding: 46px 28px;
                text-align: center;
                align-items: center;
            }
            .welcome-title { font-size: clamp(2.8rem, 13vw, 4.6rem); }
            .welcome-actions { justify-content: center; }
            .portrait-panel {
                min-height: 430px;
                border-left: 0;
                border-top: 1px solid var(--glass-border);
            }
            .portrait-panel img { width: 78%; }
        }

        @media (max-width: 520px) {
            .welcome-page { padding: 10px; }
            .welcome-content { padding: 38px 20px; }
            .welcome-text { font-size: 16px; }
            .portrait-panel { min-height: 350px; }
            .portrait-panel img { width: 86%; }
            .portrait-label { left: 12px; right: 12px; bottom: 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .welcome-shell { animation: none; }
        }
    </style>
</head>
<body>
    <main class="welcome-page">
        <section class="welcome-shell" aria-labelledby="welcome-title">
            <div class="welcome-content">
                <div class="welcome-badge">Portfolio Welcome</div>
                <h1 class="welcome-title" id="welcome-title">Welcome to <span>Shaik Fayaz</span></h1>
                <p class="welcome-text">Explore my projects, skills, education, and journey as a computer science student building thoughtful digital experiences.</p>
                <div class="welcome-actions">
                    <a href="home.html" class="enter-btn">Enter Portfolio <span aria-hidden="true">→</span></a>
                    <p class="rating-reminder"><strong>★</strong> After exploring, please leave your rating.</p>
                </div>
            </div>

           
            </div>
        </section>
    </main>
</body>
</html>
